name: Train Booking Checker

on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

jobs:
  check-bookings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore Gmail Credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS }}" | base64 -d > credentials.json
          echo "${{ secrets.GOOGLE_TOKEN }}" | base64 -d > token.json

      - name: Debug Restored Files
        run: |
          echo "===== Files ====="
          ls -l

          echo ""
          echo "===== credentials.json exists ====="
          test -f credentials.json && echo "YES" || echo "NO"

          echo ""
          echo "===== token.json exists ====="
          test -f token.json && echo "YES" || echo "NO"

      - name: Debug token.json
        run: |
          python - <<'EOF'
          import json

          try:
              with open("token.json") as f:
                  data = json.load(f)

              print("token.json keys:")
              print(list(data.keys()))

          except Exception as e:
              print("ERROR:", e)
          EOF

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Travel Dashboard
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python telegram_dashboard.py
