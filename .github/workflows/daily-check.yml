name: Train Booking Checker

on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

jobs:
  check-bookings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore Gmail Credentials
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          creds_b64 = os.environ.get("GOOGLE_CREDENTIALS", "")
          token_b64 = os.environ.get("GOOGLE_TOKEN", "")

          if not creds_b64:
              raise SystemExit("GOOGLE_CREDENTIALS secret is missing")
          if not token_b64:
              raise SystemExit("GOOGLE_TOKEN secret is missing")

          creds_bytes = base64.b64decode(creds_b64)
          token_bytes = base64.b64decode(token_b64)

          Path("credentials.json").write_bytes(creds_bytes)
          Path("token.json").write_bytes(token_bytes)

          # Validate the token file structure in a helpful way.
          try:
              token_data = json.loads(token_bytes.decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"GOOGLE_TOKEN secret is not valid JSON: {exc}") from exc

          required = {"client_id", "refresh_token", "client_secret"}
          missing = sorted(required - set(token_data.keys()))
          if missing:
              raise SystemExit(f"GOOGLE_TOKEN is missing required fields: {', '.join(missing)}")
          PY
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}

      - name: Debug Restored Files
        run: |
          echo "===== Files ====="
          ls -l

          echo ""
          echo "===== credentials.json exists ====="
          test -f credentials.json && echo "YES" || echo "NO"

          echo ""
          echo "===== token.json exists ====="
          test -f token.json && echo "YES" || echo "NO"

      - name: Debug token.json
        run: |
          python - <<'EOF'
          import json

          try:
              with open("token.json") as f:
                  data = json.load(f)

              print("token.json keys:")
              print(list(data.keys()))

          except Exception as e:
              print("ERROR:", e)
          EOF

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Travel Dashboard
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python telegram_dashboard.py
